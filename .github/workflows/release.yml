name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install verification dependencies
        run: uv sync --all-extras --group test --group lint

      - name: Verify source
        run: |
          uv run ruff check src/ tests/ examples/ benchmarks/
          uv run ruff format --check src/ tests/ examples/ benchmarks/
          uv run pytest -n auto tests/ -q --tb=short

      - name: Build distributions
        run: uv build

      - name: Validate distributions
        run: uvx twine check dist/*

      - name: Create checksums
        run: sha256sum dist/* > SHA256SUMS.txt

      - name: Create GitHub release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/* SHA256SUMS.txt
          --generate-notes
          --verify-tag
          --title "gMAS $GITHUB_REF_NAME"

      - name: Create GitHub prerelease
        if: ${{ contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/* SHA256SUMS.txt
          --generate-notes
          --prerelease
          --verify-tag
          --title "gMAS $GITHUB_REF_NAME"

      - name: Publish final release to PyPI
        if: ${{ vars.PUBLISH_TO_PYPI == 'true' && !contains(github.ref_name, '-') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
