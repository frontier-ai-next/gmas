name: Bug report
description: Report reproducible incorrect behavior in gMAS.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve gMAS. Please remove credentials and private prompts from examples and logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest runnable example and any relevant configuration.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: gMAS version
      placeholder: v0.1.0, commit SHA, or package version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Python 3.12, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove API keys, secrets, and sensitive data.
      render: shell
